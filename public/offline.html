<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline · OrderApp</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #f5f5f7; color: #1d1d1f; text-align: center; }
    .card { background: #fff; border: 1px solid #e5e5ea; border-radius: 20px; padding: 40px; max-width: 320px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #6e6e73; font-size: 14px; margin: 0 0 20px; }
    button { background: #1a7f37; color: #fff; border: 0; border-radius: 12px;
             padding: 12px 24px; font-size: 15px; font-weight: 600; min-height: 44px; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:44px">🥬</div>
    <h1>You're offline</h1>
    <p>Ordering needs a connection. Check your internet and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
